# --- HTTP → редірект на HTTPS для dashboard ---
server {
    listen 80;
    server_name dashboard.serafimapp.work;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS для dashboard ---
server {
    listen 443 ssl;
    server_name dashboard.serafimapp.work;

    ssl_certificate /etc/letsencrypt/live/dashboard.serafimapp.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.serafimapp.work/privkey.pem;

    # --- API без авторизації ---
    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

            # Таймаути для довгих запитів
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # --- Basic Auth для всього іншого ---
    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

            # Таймаути для довгих запитів
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}

# --- HTTP → редірект на HTTPS для n8n ---
server {
    listen 80;
    server_name n8n.serafimapp.work;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS для n8n ---
server {
    listen 443 ssl;
    server_name n8n.serafimapp.work;

    ssl_certificate /etc/letsencrypt/live/n8n.serafimapp.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.serafimapp.work/privkey.pem;

    location / {
        proxy_pass http://n8n-main:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket для n8n UI
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}